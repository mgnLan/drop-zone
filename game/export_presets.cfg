html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\"><style>body{background:#05070c}#status{background:transparent}#status-progress{appearance:none;width:300px;height:8px}#status-progress::-webkit-progress-bar{background:#1a2030;border-radius:4px}#status-progress::-webkit-progress-value{background:linear-gradient(90deg,#ff3c6e,#28d8ff);border-radius:4px}#status-progress::-moz-progress-bar{background:linear-gradient(90deg,#ff3c6e,#28d8ff)}#status-splash{position:fixed;inset:0;width:100vw;height:100vh;max-width:none;max-height:none;object-fit:contain;background:#05070c;filter:drop-shadow(0 0 18px rgba(255,60,110,.45))}#status-notice{border-color:#ff3c6e55;background:#0a0e18}#status{background:linear-gradient(transparent 78%,rgba(3,5,10,.9) 94%) !important}#status::before{content:'ТОЧКА СБРОСА';position:absolute;top:6%;left:0;right:0;z-index:2;text-align:center;font:800 clamp(30px,7vw,68px) Manrope,Arial,sans-serif;letter-spacing:clamp(4px,1.2vw,10px);color:#eafcff;text-shadow:0 0 26px #28d8ff,0 0 8px #28d8ff;pointer-events:none}#status::after{content:'КОРОЛЕВСКАЯ БИТВА · ЗАГРУЗКА';position:absolute;bottom:calc(10% + 30px);left:0;right:0;text-align:center;font:700 clamp(13px,2.4vw,22px) Manrope,Arial,sans-serif;letter-spacing:5px;color:#28d8ff;text-shadow:0 0 16px #28d8ff,0 0 4px #28d8ff;animation:dzpulse 1.1s ease-in-out infinite}@keyframes dzpulse{0%,100%{opacity:1}50%{opacity:.35}}#status-progress{width:min(60vw,520px) !important;height:14px !important;bottom:10% !important;box-shadow:0 0 12px rgba(40,216,255,.5)}</style><script src=\"vk-bridge.min.js\" onerror=\"window.dzVKError='vk-bridge.min.js не загрузился'\"></script><script>(function(){ window.dzVKError=window.dzVKError||''; function noBridge(){return !window.vkBridge||!window.vkBridge.send;} if(noBridge()){window.dzVKError='мост ВК не загрузился (vk-bridge)';} else{try{window.vkBridge.send('VKWebAppInit');}catch(e){window.dzVKError='VKWebAppInit: '+e;}} window.dzRewarded={show:function(){ if(noBridge()){window.dzVKError='реклама: мост ВК недоступен';return false;} window.vkBridge.send('VKWebAppShowNativeAds',{ad_format:'reward'}).then(function(res){ if(res&&res.result===true&&window.__dz_ad_reward){window.__dz_ad_reward();} }).catch(function(e){window.dzVKError='реклама: '+String(e).slice(0,120);}); return true;}}; var DZ_PACKS=[{n:'Разведчик · 210 монет',p:29},{n:'Штурмовик · 825 монет',p:99},{n:'Снайпер · 1950 монет',p:199},{n:'Легенда · 4800 монет',p:399}]; var DZ_ITEMS={bp:{n:'Premium Battle Pass · сезон 1',p:399}}; window.dzOrder=function(pack){ var P=DZ_PACKS[pack];if(!P){return false;} if(noBridge()){window.dzVKError='оплата: мост ВК недоступен';return false;} window.vkBridge.send('VKWebAppShowOrderBox',{type:'item',item:P.n,price:P.p}).then(function(res){ if(res&&res.order_id&&window.__dz_order){window.__dz_order({status:'paid',pack:pack,order_id:String(res.order_id)});} }).catch(function(e){window.dzVKError='оплата: '+String(e).slice(0,120);}); return true;}; window.dzOrderItem=function(id){ var I=DZ_ITEMS[id];if(!I){return false;} if(noBridge()){window.dzVKError='оплата: мост ВК недоступен';return false;} window.vkBridge.send('VKWebAppShowOrderBox',{type:'item',item:I.n,price:I.p}).then(function(res){ if(res&&res.order_id&&window.__dz_order){window.__dz_order({status:'paid',item:id,order_id:String(res.order_id)});} }).catch(function(e){window.dzVKError='оплата (предмет): '+String(e).slice(0,120);}); return true;}; var dzFired=false; function dzReady(p){ if(dzFired){return;} if(!window.__dz_vk_ready){setTimeout(function(){dzReady(p);},200);return;} dzFired=true;window.__dz_vk_ready(p); } if(noBridge()){ dzReady({__error:window.dzVKError}); }else{ /* вход не должен зависеть от GetUserInfo: sign уже в URL, имя — не обязательно. */ /* в ВК этот промис может не резолвиться и не реджектиться вовсе — ловить нечего */ setTimeout(function(){window.dzVKError=window.dzVKError||'ВК не ответил на GetUserInfo';dzReady({name:''});},2500); var initP=null; try{initP=window.vkBridge.send('VKWebAppInit');}catch(e){window.dzVKError='VKWebAppInit: '+e;} if(!initP||!initP.then){initP=Promise.resolve(null);} initP.catch(function(){return null;}).then(function(){ try{var r1=window.vkBridge.send('VKWebAppResizeWindow',{width:window.innerWidth,height:Math.max(window.innerHeight||0,760)}); if(r1&&r1.catch){r1.catch(function(){});}}catch(e){} setTimeout(function(){try{var r2=window.vkBridge.send('VKWebAppResizeWindow',{width:window.innerWidth,height:Math.max(window.innerHeight||0,760)}); if(r2&&r2.catch){r2.catch(function(){});}}catch(e){}},2500); return window.vkBridge.send('VKWebAppGetUserInfo'); }).then(function(r){ window.dzVK=(r&&r.id)?{id:r.id,name:(r.first_name||'')+' '+(r.last_name||'')}:null; dzReady(window.dzVK||{name:''}); }).catch(function(e){ window.dzVKError='GetUserInfo: '+String(e).slice(0,120); dzReady({name:''}); }); } })();</script>"
